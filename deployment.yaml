apiVersion: apps/v1
kind: Deployment
metadata:
  name: project2-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project2-app
  template:
    metadata:
      labels:
        app: project2-app
    spec:
      containers:
        - name: project2-app
          image: mayuri898/project2-python-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080